name: Run Tests

on:
push:

jobs:
test:
name: Run Python Script Tests
runs-on: ubuntu-latest

steps:
- name: Check out repository
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.x'

- name: Test 1 - 10 Numbers
run: |
python3 find_lowest_number.py test_data/test1_input.txt test1_actual.txt
diff test1_actual.txt test_data/test1_expected.txt

- name: Test 2 - 1 Number
run: |
python3 find_lowest_number.py test_data/test2_input.txt test2_actual.txt
diff test2_actual.txt test_data/test2_expected.txt

- name: Test 3 - Blank File
run: |
python3 find_lowest_number.py test_data/test3_input.txt test3_actual.txt
diff test3_actual.txt test_data/test3_expected.txt
